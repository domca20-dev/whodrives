<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WhoDrives">
<meta name="description" content="Kdo dnes řídí? Férové střídání aut v partě podle ujetých kilometrů.">
<title>WhoDrives – kdo dnes řídí</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="app" id="app">
      <header class="top" id="top">
        <div class="grp">
          <div class="ico" aria-hidden="true"><svg class="wd-icon" viewBox="68 -724 476 476" aria-hidden="true"><g transform="scale(1 -1)"><path d="M174.9141 724L437.0859 724C496.133 724 544 676.133 544 617.0859L544 354.9141C544 295.867 496.133 248 437.0859 248L174.9141 248C115.867 248 68 295.867 68 354.9141L68 617.0859C68 676.133 115.867 724 174.9141 724Z" fill="#F5C428"/><path d="M129.3594 557.5859L167.4394 557.5859L187.6694 464.7659L213.8494 557.5859L253.1194 557.5859L279.2994 464.7659L299.5294 557.5859L337.6094 557.5859L297.1494 414.7859L256.6894 414.7859L233.4844 504.0359L210.2794 414.7859L169.8194 414.7859Z" fill="#23272E"/><path d="M345.9394 557.5859L411.3894 557.5859C450.8226 557.5859 482.7894 525.619 482.7894 486.1859C482.7894 446.7528 450.8226 414.7859 411.3894 414.7859L305.4794 414.7859ZM374.4994 524.2659L410.1994 524.2659C431.2304 524.2659 448.2794 507.217 448.2794 486.1859C448.2794 465.155 431.2304 448.1059 410.1994 448.1059L353.0794 448.1059Z" fill="#23272E" fill-rule="evenodd"/></g></svg></div>
          <button class="grp-switch" id="grpBtn" type="button" aria-expanded="false" aria-controls="grpPicker">
            <span class="info">
              <b id="grpTitle">WhoDrives</b>
              <small id="grpSub"></small>
            </span>
            <svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Přepnout tmavý režim"></button>
        </div>
        <div class="grp-picker" id="grpPicker"><div id="grpList"></div></div>
      </header>

      <main class="scroll" id="view" tabindex="-1"></main>

      <button class="fab" id="fab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Zapsat jízdu
      </button>

      <nav class="tabs" id="tabs" aria-label="Hlavní navigace">
        <button data-tab="home" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>
          Přehled
        </button>
        <button data-tab="rides" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Historie
        </button>
        <button data-tab="settle" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
          Vyrovnání
          <span class="count" id="settleCount" hidden></span>
        </button>
        <button data-tab="group" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 010 6M18 15c2 .5 3 2 3 5"/></svg>
          Skupina
        </button>
      </nav>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAct" type="button" hidden></button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
